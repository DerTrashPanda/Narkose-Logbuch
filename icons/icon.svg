<!-- Eigenes App-Symbol: Klemmbrett (Logbuch) mit Pulskurve auf petrolfarbenem Grund.
     Der wichtige Inhalt liegt in der mittleren "sicheren Zone", damit Android das Symbol
     rund oder eckig zuschneiden darf, ohne etwas abzuschneiden. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#0f6e7a"/>
  <!-- Klemmbrett -->
  <rect x="156" y="130" width="200" height="252" rx="22" fill="#ffffff"/>
  <!-- Klemme oben -->
  <rect x="206" y="112" width="100" height="44" rx="14" fill="#0b525b"/>
  <!-- Pulskurve -->
  <polyline points="178,262 222,262 240,224 264,308 284,240 298,262 334,262"
            fill="none" stroke="#0f6e7a" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Zeilen wie in einem Logbuch -->
  <rect x="186" y="320" width="140" height="12" rx="6" fill="#b9d8dc"/>
  <rect x="186" y="344" width="96" height="12" rx="6" fill="#b9d8dc"/>
  <rect x="186" y="186" width="96" height="12" rx="6" fill="#b9d8dc"/>
</svg>
